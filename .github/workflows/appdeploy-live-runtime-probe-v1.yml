name: appdeploy-live-runtime-probe-v1

on:
  pull_request:
    paths:
      - 'experiments/appdeploy_live_browser_probe_v1.mjs'
      - '.github/workflows/appdeploy-live-runtime-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser probe dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0
      - name: Run live AppDeploy browser probes
        run: node experiments/appdeploy_live_browser_probe_v1.mjs
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: appdeploy-live-browser-probe-v1
          path: appdeploy-live-browser-probe-v1.json
          if-no-files-found: error
