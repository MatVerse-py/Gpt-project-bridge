name: appdeploy-live-runtime-probe-v1

on:
  pull_request:
    paths:
      - 'experiments/appdeploy_live_runtime_probe_v1.py'
      - '.github/workflows/appdeploy-live-runtime-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe live AppDeploy external runtime
        run: PYTHONPATH=. python experiments/appdeploy_live_runtime_probe_v1.py
      - name: Probe live AppDeploy secret plane
        run: PYTHONPATH=. python experiments/appdeploy_secret_plane_probe_v1.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: appdeploy-live-runtime-probe-v1
          path: |
            appdeploy-live-runtime-probe-v1.json
            appdeploy-secret-plane-probe-v1.json
          if-no-files-found: error
