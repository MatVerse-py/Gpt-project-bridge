name: Apply GovernedOrganism root-cache promotion v1

on:
  push:
    branches: [astra/organism-root-cache-promote-v1]
    paths:
      - 'scripts/apply_organism_root_cache_v1.py'
      - '.github/workflows/apply-organism-root-cache-v1.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/organism-root-cache-promote-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply deterministic preimage-locked patch
        run: python scripts/apply_organism_root_cache_v1.py
      - name: Verify patch scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "app/organism_loop.py"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused semantic regression
        run: >-
          python -m pytest -q
          tests/test_organism_loop.py
          tests/test_organism_state_root_cache.py
          tests/test_constitutional_dependency_contract.py
      - name: Run post-patch scaling diagnostic
        run: >-
          PYTHONPATH=. python benchmarks/organism_scaling_diagnostics_v2.py
          --iterations 300
          --workers 4
          --modes sequential,thread,process
          --profile-iterations 400
          --bucket-size 100
          --output organism-root-cache-promotion-v1.json
      - name: Upload promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: organism-root-cache-promotion-v1
          path: organism-root-cache-promotion-v1.json
          if-no-files-found: error
      - name: Commit patch only after all gates pass
        run: |
          git config user.name "MatVerse CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/organism_loop.py
          git commit -m "Optimize GovernedOrganism state-root reuse"
          git push origin HEAD:astra/organism-root-cache-promote-v1
