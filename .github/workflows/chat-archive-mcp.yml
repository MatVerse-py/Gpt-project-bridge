name: MatVerse Chat Archive MCP

on:
  push:
    branches:
      - integration/chat-archive-mcp-v1
  pull_request:
    branches:
      - integration/local-web-mcp-v1
      - integration/cognitive-relay-fullstack-v1
      - main
    paths:
      - "app/chat_archive_mcp.py"
      - "app/matverse_mcp.py"
      - "tests/test_chat_archive_mcp.py"
      - "docs/CHAT_ARCHIVE_MCP.md"
      - ".github/workflows/chat-archive-mcp.yml"

permissions:
  contents: read

concurrency:
  group: chat-archive-mcp
  cancel-in-progress: true

jobs:
  archive-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile archive and Bridge launcher
        run: python -m compileall -q app/chat_archive_mcp.py app/matverse_mcp.py tests/test_chat_archive_mcp.py
      - name: Run archive tests
        run: python -m unittest discover -s tests -p 'test_chat_archive_mcp.py' -v
