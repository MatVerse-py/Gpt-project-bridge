name: Bridge and ProjectVault CI
on:
  push:
    branches: [main, world-real/v1-bootstrap]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/run_overlay_acceptance.py --output /tmp/overlay-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-acceptance
          path: /tmp/overlay-acceptance.json
  projectvault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'apps/api[test]'
      - run: PYTHONPATH=apps/api pytest -c apps/api/pyproject.toml apps/api/tests
      - run: python -m compileall -q apps/api/projectvault scripts
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/web/app.js
      - run: docker build -t gpt-project-bridge-web:test apps/web
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gpt-project-bridge-api:test apps/api
      - run: docker compose config >/dev/null
        env:
          GPB_API_TOKEN: ci-only-token
