name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e 'apps/api[test]'
      - run: python -m compileall -q apps/api/projectvault apps/api/tests scripts
      - run: PYTHONPATH=apps/api pytest apps/api/tests
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/web/app.js
      - run: docker build -t gpt-project-bridge-web:test apps/web
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gpt-project-bridge-api:test apps/api
      - run: docker compose config >/dev/null
        env:
          GPB_API_TOKEN: ci-only-token
