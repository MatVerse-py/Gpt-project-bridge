name: Controlled pilot reference evidence v1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Execute customer-like controlled pilot reference
        run: >-
          python scripts/run_controlled_pilot_reference.py
          --build-commit "$GITHUB_SHA"
          --build-ref "$GITHUB_REF_NAME"
          --output evidence/pilot-v1/EVIDENCE_PACK.json
      - name: Run regression suite
        run: pytest -q
      - name: Upload commercial reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-pilot-reference-evidence
          path: evidence/pilot-v1/EVIDENCE_PACK.json
          if-no-files-found: error
