name: Cross-substrate governed causal inheritance v1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "experiments/cross_substrate_causal_inheritance/**"
      - ".github/workflows/cross-substrate-gci-v1.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PREREG_SHA256: "7b496c5a8bf5750297d7c14083e965372e517fc867c244d784ec929a4213cabf"
  STACK_COMMIT: "4f91c9223d587a56cc36d8496812e837e0bc0508"

jobs:
  origin:
    name: origin (${{ matrix.sequence }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sequence: QWEN_TO_SMOL
            model: Qwen/Qwen2.5-0.5B-Instruct
          - sequence: SMOL_TO_QWEN
            model: HuggingFaceTB/SmolLM2-360M-Instruct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install real-model runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers>=4.45,<5' 'safetensors>=0.4'
      - name: Verify frozen preregistration
        run: |
          echo "${PREREG_SHA256}  experiments/cross_substrate_causal_inheritance/prereg_v1.json" | sha256sum -c -
      - name: Execute origin model with frozen observable contract
        run: |
          python experiments/cross_substrate_causal_inheritance/run_candidate_model.py \
            --model "${{ matrix.model }}" \
            --role origin \
            --sequence "${{ matrix.sequence }}" \
            --output "origin-${{ matrix.sequence }}.json"
      - name: Upload origin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin-${{ matrix.sequence }}
          path: origin-${{ matrix.sequence }}.json
      - name: Enforce origin invariant fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("origin-${{ matrix.sequence }}.json")
          d = json.loads(p.read_text())
          assert d["runtime_pass"] is True, d
          PY

  target:
    name: target-context-flushed (${{ matrix.sequence }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sequence: QWEN_TO_SMOL
            model: HuggingFaceTB/SmolLM2-360M-Instruct
          - sequence: SMOL_TO_QWEN
            model: Qwen/Qwen2.5-0.5B-Instruct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install real-model runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers>=4.45,<5' 'safetensors>=0.4'
      - name: Verify frozen preregistration
        run: |
          echo "${PREREG_SHA256}  experiments/cross_substrate_causal_inheritance/prereg_v1.json" | sha256sum -c -
      - name: Execute target model without origin context or governance pack
        run: |
          python experiments/cross_substrate_causal_inheritance/run_candidate_model.py \
            --model "${{ matrix.model }}" \
            --role target \
            --sequence "${{ matrix.sequence }}" \
            --output "target-${{ matrix.sequence }}.json"
      - name: Upload target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.sequence }}
          path: target-${{ matrix.sequence }}.json
      - name: Enforce target invariant fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("target-${{ matrix.sequence }}.json")
          d = json.loads(p.read_text())
          assert d["runtime_pass"] is True, d
          PY

  governance:
    name: independent-promotion (${{ matrix.sequence }})
    needs: origin
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sequence: QWEN_TO_SMOL
          - sequence: SMOL_TO_QWEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download origin evidence
        uses: actions/download-artifact@v4
        with:
          name: origin-${{ matrix.sequence }}
          path: evidence/origin
      - name: Pin causal runtime
        run: |
          git clone -q https://github.com/MatVerse-py/matverse-stack-production.git causal-stack
          git -C causal-stack checkout -q "${STACK_COMMIT}"
          test "$(git -C causal-stack rev-parse HEAD)" = "${STACK_COMMIT}"
          pip install 'pydantic>=2.0'
      - name: Build rejection-derived independently adjudicated governance pack
        run: |
          python experiments/cross_substrate_causal_inheritance/build_governance_pack.py \
            --origin-result "evidence/origin/origin-${{ matrix.sequence }}.json" \
            --prereg experiments/cross_substrate_causal_inheritance/prereg_v1.json \
            --stack-root causal-stack \
            --sequence "${{ matrix.sequence }}" \
            --output "governance-${{ matrix.sequence }}.json"
      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-${{ matrix.sequence }}
          path: governance-${{ matrix.sequence }}.json

  evaluate:
    name: external-gate-after-model-replacement (${{ matrix.sequence }})
    needs: [target, governance]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sequence: QWEN_TO_SMOL
          - sequence: SMOL_TO_QWEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download target candidate only after target generation completed
        uses: actions/download-artifact@v4
        with:
          name: target-${{ matrix.sequence }}
          path: evidence/target
      - name: Download external governance pack
        uses: actions/download-artifact@v4
        with:
          name: governance-${{ matrix.sequence }}
          path: evidence/governance
      - name: Pin causal runtime
        run: |
          git clone -q https://github.com/MatVerse-py/matverse-stack-production.git causal-stack
          git -C causal-stack checkout -q "${STACK_COMMIT}"
          test "$(git -C causal-stack rev-parse HEAD)" = "${STACK_COMMIT}"
          pip install 'pydantic>=2.0' 'requests>=2.32'
      - name: Evaluate identical target candidate across preregistered arms
        run: |
          python experiments/cross_substrate_causal_inheritance/evaluate_target.py \
            --target-result "evidence/target/target-${{ matrix.sequence }}.json" \
            --governance-pack "evidence/governance/governance-${{ matrix.sequence }}.json" \
            --prereg experiments/cross_substrate_causal_inheritance/prereg_v1.json \
            --stack-root causal-stack \
            --sequence "${{ matrix.sequence }}" \
            --output "eval-${{ matrix.sequence }}.json"
      - name: Upload sequence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.sequence }}
          path: eval-${{ matrix.sequence }}.json
      - name: Enforce sequence result fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("eval-${{ matrix.sequence }}.json")
          d = json.loads(p.read_text())
          assert d["primary_result"] == "PASS", d
          PY

  compare:
    name: adjudicate two-direction cross-model evidence
    needs: evaluate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download both sequence reports
        uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          path: evidence/evals
          merge-multiple: true
      - name: Compare and freeze evidence pack
        run: |
          python experiments/cross_substrate_causal_inheritance/compare_sequences.py \
            --pattern "evidence/evals/eval-*.json" \
            --output cross-substrate-gci-v1-evidence-pack.json
          sha256sum cross-substrate-gci-v1-evidence-pack.json
      - name: Upload final evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-substrate-gci-v1-evidence
          path: cross-substrate-gci-v1-evidence-pack.json
      - name: Enforce final promotion gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("cross-substrate-gci-v1-evidence-pack.json").read_text())
          assert d["primary_result"] == "PASS", d
          assert d["promotion"]["PATENTABILITY"] == "HOLD"
          assert d["promotion"]["INDEPENDENT_PROVIDER_REPRODUCTION"] == "HOLD"
          PY
