name: Executor substitution v1

on:
  pull_request:
    paths:
      - 'app/executor_substitution.py'
      - 'experiments/executor_substitution_v1.py'
      - 'tests/test_executor_substitution.py'
      - 'EXPERIMENT_EXECUTOR_SUBSTITUTION_V1.md'
      - '.github/workflows/executor-substitution-v1.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the live OpenAI paired experiment'
        required: true
        default: false
        type: boolean
      model_a:
        description: 'Explicit OpenAI model id for arm A'
        required: false
        type: string
      model_b:
        description: 'Explicit OpenAI model id for arm B'
        required: false
        type: string

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run executor substitution tests
        run: pytest -q tests/test_executor_substitution.py tests/test_openai_runtime.py tests/test_physiology.py

  live-openai:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MATVERSE_EXECUTOR_A_MODEL: ${{ inputs.model_a }}
      MATVERSE_EXECUTOR_B_MODEL: ${{ inputs.model_b }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run live paired substitution
        run: PYTHONPATH=. python experiments/executor_substitution_v1.py --output executor-substitution-v1-report.json
      - name: Upload minimized experiment report
        uses: actions/upload-artifact@v4
        with:
          name: executor-substitution-v1-report
          path: executor-substitution-v1-report.json
          if-no-files-found: error
