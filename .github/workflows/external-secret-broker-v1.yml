name: External Secret Broker v1

on:
  pull_request:
    paths:
      - "services/external_secret_broker/**"
      - "tests/test_external_secret_broker.py"
      - ".github/workflows/external-secret-broker-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: pip install -r requirements.txt

      - name: Compile broker service
        run: |
          python -m compileall -q services/external_secret_broker

      - name: Run broker security tests
        run: |
          pytest -q tests/test_external_secret_broker.py

      - name: Build deployable container
        run: |
          docker build \
            -f services/external_secret_broker/Dockerfile \
            -t matverse-external-secret-broker:${{ github.sha }} \
            .

      - name: Produce implementation evidence
        run: |
          unset OPENAI_API_KEY PROVIDER_OPENAI_API_KEY \
            MATVERSE_OPENAI_PROVIDER_SECRET \
            MATVERSE_OPENAI_PROVIDER_SECRET_FILE \
            MATVERSE_ALLOW_ENV_SECRET || true
          python -m services.external_secret_broker.evidence_probe \
            --output evidence/external-secret-broker-v1/EVIDENCE_PACK.json

      - name: Enforce secret boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("evidence/external-secret-broker-v1/EVIDENCE_PACK.json")
          evidence = json.loads(p.read_text(encoding="utf-8"))
          secret = evidence["secret_boundary"]
          promotion = evidence["promotion"]

          if secret["provider_secret_present_in_ci_env"] is not False:
              raise SystemExit("provider secret reached CI implementation job")
          if secret["provider_secret_exposed_to_executor"] is not False:
              raise SystemExit("provider secret exposure invariant failed")
          if secret["provider_secret_persisted_by_service"] is not False:
              raise SystemExit("provider secret persistence invariant failed")
          if promotion["external_deployment"] != "HOLD_NOT_DEPLOYED":
              raise SystemExit("CI must not claim external deployment")
          if promotion["vault_kms_hsm"] != "HOLD_EXTERNAL_BACKEND_UNVERIFIED":
              raise SystemExit("CI must not claim Vault/KMS/HSM verification")
          print(json.dumps({
              "result": evidence["result"],
              "implementation": promotion["service_implementation"],
              "external_deployment": promotion["external_deployment"],
              "evidence_pack_hash": evidence["evidence_pack_hash"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: external-secret-broker-v1-evidence
          path: evidence/external-secret-broker-v1/EVIDENCE_PACK.json
          if-no-files-found: error
