name: Guard Cloudflare container typing fix

on:
  push:
    branches: [production/durable-institutional-state-v1]
    paths:
      - '.github/workflows/fix-cloudflare-container-typing.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/durable-institutional-state-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact SDK generic fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('deploy/cloudflare/src/index.ts')
          text = p.read_text(encoding='utf-8')
          old = 'constructor(ctx: DurableObjectState, env: MatVerseEnv) {'
          new = 'constructor(ctx: DurableObjectState<{}>, env: MatVerseEnv) {'
          if old not in text:
              raise SystemExit('expected constructor signature not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Python regression
        run: |
          pip install -r requirements.txt
          pytest -q
      - name: Cloudflare type and dry-run checks
        working-directory: deploy/cloudflare
        run: |
          npm install
          npm run check
          npx wrangler deploy --dry-run
      - name: Commit only after all gates pass
        run: |
          git config user.name "MatVerse CI"
          git config user.email "actions@users.noreply.github.com"
          git add deploy/cloudflare/src/index.ts
          git commit -m "Fix Cloudflare Container DurableObjectState typing"
          git push origin HEAD:production/durable-institutional-state-v1
