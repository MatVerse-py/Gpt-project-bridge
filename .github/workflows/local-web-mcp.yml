name: MatVerse Local Web MCP

on:
  push:
    branches:
      - integration/local-web-mcp-v1
  pull_request:
    branches:
      - integration/cognitive-relay-fullstack-v1
      - main
    paths:
      - "app/local_web_mcp.py"
      - "app/phoenix_receipts.py"
      - "tests/test_local_web_mcp.py"
      - "docs/LOCAL_WEB_MCP.md"
      - ".github/workflows/local-web-mcp.yml"

permissions:
  contents: read

concurrency:
  group: local-web-mcp-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile local operator and PHOENIX journal
        run: python -m compileall -q app/local_web_mcp.py app/phoenix_receipts.py tests/test_local_web_mcp.py
      - name: Run local web MCP and PHOENIX tests
        run: python -m unittest discover -s tests -p 'test_local_web_mcp.py' -v
