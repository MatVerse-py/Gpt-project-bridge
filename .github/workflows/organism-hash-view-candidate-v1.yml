name: GovernedOrganism no-clone hash-view candidate v1

on:
  pull_request:
    paths:
      - 'benchmarks/organism_hash_view_candidate_v1.py'
      - '.github/workflows/organism-hash-view-candidate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Regression tests
        run: python -m pytest -q tests/test_organism_loop.py tests/test_organism_state_root_cache.py
      - name: Measure exact no-clone hash view
        run: >-
          PYTHONPATH=. python benchmarks/organism_hash_view_candidate_v1.py
          --iterations 600
          --bucket-size 100
          --repeats 20
          --output organism-hash-view-candidate-v1.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: organism-hash-view-candidate-v1
          path: organism-hash-view-candidate-v1.json
          if-no-files-found: error
