name: Publication Bridge CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/publication_bridge.py'
      - 'tests/test_publication_bridge.py'
      - 'requirements-publication.txt'
      - 'PUBLICATION_BRIDGE_V1.md'
      - '.github/workflows/publication-bridge-ci.yml'
  push:
    branches: [publication-bridge/v1]
    paths:
      - 'app/publication_bridge.py'
      - 'tests/test_publication_bridge.py'
      - 'requirements-publication.txt'
      - 'PUBLICATION_BRIDGE_V1.md'
      - '.github/workflows/publication-bridge-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_publication_bridge.py
      - name: Secret-boundary static check
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude='PUBLICATION_BRIDGE_V1.md' \
            -E '(ARXIV_PASSWORD[[:space:]]*=.+|PAPERPUSH_PASSWORD[[:space:]]*=.+)' .; then
            echo 'Credential-like assignment found in tracked runtime/test files.' >&2
            exit 1
          fi
