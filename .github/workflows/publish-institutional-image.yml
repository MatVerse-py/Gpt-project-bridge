name: Publish institutional runtime image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push institutional image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.institutional
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/matverse-py/matverse-trust-runtime:pilot-v1
            ghcr.io/matverse-py/matverse-trust-runtime:sha-${{ github.sha }}
          provenance: true
          sbom: true
