name: QeX L0 Substrate Invariance CI

on:
  push:
    branches: [integration/qex-iaquantumchain-l0-v1]
  pull_request:
    branches: [main]
    paths:
      - 'app/qex_adapters.py'
      - 'app/qex_experiment.py'
      - 'app/qex_substrate.py'
      - 'app/iaquantumchain/**'
      - 'tests/test_qex_*.py'
      - 'tests/test_iaquantumchain*.py'
      - 'requirements.txt'
      - 'app/main.py'
      - 'docs/QEX_SUBSTRATE_INVARIANCE_V1.md'
      - '.github/workflows/qex-substrate-ci.yml'

jobs:
  qex-l0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_qex_substrate.py tests/test_qex_adapters.py tests/test_qex_review_regressions.py tests/test_iaquantumchain_l0_integration.py
