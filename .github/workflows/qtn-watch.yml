name: QTN Watch

on:
  pull_request:
    paths:
      - "app/qtn_watch.py"
      - "app/qtn_semantic_review.py"
      - "app/qtn_source_lineage.py"
      - "app/qtn_context.py"
      - "app/qtn_revision_ledger.py"
      - "app/qtn_evidence_binding.py"
      - "scripts/run_qtn_watch.py"
      - "scripts/qtn_bind_excerpt.py"
      - "tests/test_qtn_watch.py"
      - "tests/test_qtn_semantic_review.py"
      - "tests/test_qtn_source_lineage.py"
      - "tests/test_qtn_cross_pr_integration.py"
      - "tests/test_qtn_governed_evidence.py"
      - "tests/test_qtn_technical_comparison.py"
      - "benchmarks/qtn_technical_comparison.py"
      - "benchmarks/__init__.py"
      - ".github/workflows/qtn-watch.yml"
      - "docs/QTN_WATCH_V1.md"
      - "docs/QTN_TSC_SEMANTIC_REVIEW_V031.md"
      - "docs/QTN_GOVERNED_EVIDENCE_V032.md"
      - "docs/QTN_TECHNICAL_ADVANTAGE_BENCHMARK_V01.md"
      - "docs/QTN_ISSUE94_DELTA_2026-10-10.md"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Materiality threshold (0..1)"
        required: false
        default: "0.68"
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: qtn-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run focused tests
        run: python -m pytest -q tests/test_qtn_watch.py tests/test_qtn_semantic_review.py tests/test_qtn_source_lineage.py tests/test_qtn_cross_pr_integration.py tests/test_qtn_governed_evidence.py tests/test_qtn_technical_comparison.py

      - name: Controlled comparison benchmark
        if: github.event_name == 'pull_request'
        run: python -m benchmarks.qtn_technical_comparison --summary-only --output "$RUNNER_TEMP/qtn-technical-comparison.json"

      - name: Preserve benchmark result
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: qtn-comparison-${{ github.sha }}
          path: ${{ runner.temp }}/qtn-technical-comparison.json
          if-no-files-found: error

      - name: Run collection smoke test
        if: github.event_name == 'pull_request'
        env:
          QTN_WATCH_THRESHOLD: ${{ inputs.threshold || '0.68' }}
          QTN_WATCH_MIN_SOURCES: "2"
          QTN_WATCH_TIMEOUT: "20"
          QTN_WATCH_MAX_AGE_DAYS: "60"
        run: python scripts/run_qtn_watch.py --json

      - name: Run QTN Watch and publish alerts
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QTN_WATCH_THRESHOLD: ${{ inputs.threshold || '0.68' }}
          QTN_WATCH_MIN_SOURCES: "2"
          QTN_WATCH_TIMEOUT: "20"
          QTN_WATCH_MAX_AGE_DAYS: "60"
          QTN_WATCH_MAX_ALERTS: "20"
        run: python scripts/run_qtn_watch.py --github-issues --json
