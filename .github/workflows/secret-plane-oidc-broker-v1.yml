name: Secret Plane OIDC broker v1

on:
  pull_request:
    paths:
      - "experiments/executor_transplant/secret_broker.py"
      - "experiments/executor_transplant/oidc_broker_probe.py"
      - "tests/test_secret_broker.py"
      - "tests/test_oidc_broker_probe.py"
      - ".github/workflows/secret-plane-oidc-broker-v1.yml"
  workflow_dispatch:

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: pip install -r requirements.txt

      - name: Compile OIDC secret-plane modules
        run: |
          python -m compileall -q \
            experiments/executor_transplant/secret_broker.py \
            experiments/executor_transplant/oidc_broker_probe.py

      - name: Run OIDC secret-plane tests
        run: |
          pytest -q \
            tests/test_secret_broker.py \
            tests/test_oidc_broker_probe.py

      - name: Produce fail-closed offline evidence
        env:
          MATVERSE_SECRET_BROKER_URL: ""
        run: |
          unset OPENAI_API_KEY PROVIDER_OPENAI_API_KEY || true
          python -m experiments.executor_transplant.oidc_broker_probe \
            --output evidence/secret-plane-oidc-broker-v1/OFFLINE_EVIDENCE_PACK.json

      - uses: actions/upload-artifact@v4
        with:
          name: secret-plane-oidc-broker-v1-offline-evidence
          path: evidence/secret-plane-oidc-broker-v1/OFFLINE_EVIDENCE_PACK.json
          if-no-files-found: error

  live-oidc-broker:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MATVERSE_SECRET_BROKER_URL: ${{ vars.MATVERSE_SECRET_BROKER_URL }}
      MATVERSE_SECRET_AUDIENCE: ${{ vars.MATVERSE_SECRET_AUDIENCE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: pip install -r requirements.txt

      - name: Assert static provider secret is absent
        run: |
          set -euo pipefail
          if [[ -n "${OPENAI_API_KEY:-}" || -n "${PROVIDER_OPENAI_API_KEY:-}" ]]; then
            echo "static provider secret unexpectedly present" >&2
            exit 1
          fi

      - name: Execute OIDC secret_ref broker probe
        run: |
          python -m experiments.executor_transplant.oidc_broker_probe \
            --output evidence/secret-plane-oidc-broker-v1/EVIDENCE_PACK.json

      - name: Enforce OIDC secret boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("evidence/secret-plane-oidc-broker-v1/EVIDENCE_PACK.json")
          evidence = json.loads(p.read_text(encoding="utf-8"))
          allowed = {
              "OIDC_SECRET_BROKER_PATH_PASS",
              "HOLD_NOT_CONFIGURED",
              "HOLD_IDENTITY_UNAVAILABLE",
              "HOLD_BROKER_ACCESS",
              "HOLD_BROKER_RESPONSE",
              "HOLD_MODEL_BINDING",
          }
          promotion = evidence["promotion"]
          if evidence["provider_secret_in_runner"] is not False:
              raise SystemExit("static provider secret reached OIDC runner")
          if evidence["provider_secret_in_local_process"] is not False:
              raise SystemExit("provider secret reached local OIDC process")
          if evidence["provider_secret_persisted"] is not False:
              raise SystemExit("provider secret persistence invariant failed")
          if promotion not in allowed:
              raise SystemExit(f"unexpected promotion state: {promotion}")
          print(json.dumps({
              "result": evidence["result"],
              "promotion": promotion,
              "secret_ref": evidence["secret_ref"],
              "evidence_pack_hash": evidence["evidence_pack_hash"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: secret-plane-oidc-broker-v1-live-evidence
          path: evidence/secret-plane-oidc-broker-v1/EVIDENCE_PACK.json
          if-no-files-found: error
