name: Secret Plane v1

on:
  pull_request:
    paths:
      - 'app/secret_plane.py'
      - 'tests/test_secret_plane.py'
      - 'SECRET_PLANE_V1.md'
      - '.github/workflows/secret-plane-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Secret Plane tests
        run: pytest -q tests/test_secret_plane.py
      - name: Adjacent security regression
        run: pytest -q tests/test_openai_runtime.py tests/test_executor_substitution.py tests/test_organism_loop.py
