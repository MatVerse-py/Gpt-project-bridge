name: gpt-project-bridge
services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      PROJECTVAULT_HOST: 0.0.0.0
      PROJECTVAULT_PORT: 8787
      PROJECTVAULT_DB: /app/data/projectvault.db
      PROJECTVAULT_PUBLIC_BASE_URL: ${GPB_PUBLIC_API_URL:-http://localhost:8787}
      PROJECTVAULT_AUTH_MODE: ${PROJECTVAULT_AUTH_MODE:-static}
      PROJECTVAULT_STATIC_TOKEN: ${GPB_API_TOKEN:?Set GPB_API_TOKEN in .env}
      PROJECTVAULT_REQUIRED_SCOPE: ${PROJECTVAULT_REQUIRED_SCOPE:-projects.read}
      PROJECTVAULT_ALLOWED_ORIGINS: https://chatgpt.com
      PROJECTVAULT_OIDC_ISSUER: ${PROJECTVAULT_OIDC_ISSUER:-}
      PROJECTVAULT_OIDC_AUDIENCE: ${PROJECTVAULT_OIDC_AUDIENCE:-}
      PROJECTVAULT_OIDC_JWKS_URL: ${PROJECTVAULT_OIDC_JWKS_URL:-}
      PROJECTVAULT_STAGING_DIR: ${PROJECTVAULT_STAGING_DIR:-/app/data/staging}
      TMPDIR: ${PROJECTVAULT_STAGING_DIR:-/app/data/staging}
      PROJECTVAULT_MAX_UPLOAD_BYTES: ${PROJECTVAULT_MAX_UPLOAD_BYTES:-6442450944}
      PROJECTVAULT_MAX_ARCHIVE_FILES: ${PROJECTVAULT_MAX_ARCHIVE_FILES:-50000}
      PROJECTVAULT_MAX_ARCHIVE_EXPANDED_BYTES: ${PROJECTVAULT_MAX_ARCHIVE_EXPANDED_BYTES:-34359738368}
      PROJECTVAULT_MAX_ARCHIVE_MEMBER_BYTES: ${PROJECTVAULT_MAX_ARCHIVE_MEMBER_BYTES:-1073741824}
      PROJECTVAULT_MAX_INDEXABLE_FILE_BYTES: ${PROJECTVAULT_MAX_INDEXABLE_FILE_BYTES:-20971520}
      PROJECTVAULT_MIN_FREE_BYTES: ${PROJECTVAULT_MIN_FREE_BYTES:-1073741824}
    volumes:
      - gpb_data:/app/data
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  core-api:
    build:
      context: .
      dockerfile: Dockerfile.core
    restart: unless-stopped
    environment:
      MATVERSE_DB: /var/lib/matverse/matverse.db
      MATVERSE_STATE_BACKEND: ${MATVERSE_STATE_BACKEND:-sqlite}
      MATVERSE_PRINCIPALS_JSON: ${MATVERSE_PRINCIPALS_JSON:?Set MATVERSE_PRINCIPALS_JSON in .env}
      MATVERSE_BUILD_COMMIT: ${MATVERSE_BUILD_COMMIT:-local}
      MATVERSE_AGENT_TIMEOUT_SECONDS: ${MATVERSE_AGENT_TIMEOUT_SECONDS:-60}
      MATVERSE_AGENT_MAX_OUTPUT_TOKENS: ${MATVERSE_AGENT_MAX_OUTPUT_TOKENS:-1024}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KILO_MODEL: ${KILO_MODEL:-}
      KILO_API_KEY: ${KILO_API_KEY:-}
      KILO_ALLOW_ANONYMOUS: ${KILO_ALLOW_ANONYMOUS:-false}
      VENICE_MODEL: ${VENICE_MODEL:-}
      VENICE_API_KEY: ${VENICE_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      HF_MODEL: ${HF_MODEL:-}
      HF_TOKEN: ${HF_TOKEN:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLAMA_CPP_MODEL: ${LLAMA_CPP_MODEL:-}
      LLAMA_CPP_URL: ${LLAMA_CPP_URL:-http://host.docker.internal:8080}
      MATVERSE_ALLOW_HOST_DOCKER_INTERNAL: ${MATVERSE_ALLOW_HOST_DOCKER_INTERNAL:-true}
      MANUS_AGENT_PROFILE: ${MANUS_AGENT_PROFILE:-lite}
      MANUS_API_KEY: ${MANUS_API_KEY:-}
      BASE44_APP_ID: ${BASE44_APP_ID:-}
      BASE44_ACCESS_TOKEN: ${BASE44_ACCESS_TOKEN:-}
      BASE44_ALLOW_WRITE: ${BASE44_ALLOW_WRITE:-false}
      MATVERSE_MEMORY_DB: ${MATVERSE_MEMORY_DB:-}
      MATVERSE_MEMORY_SOURCE_ID: ${MATVERSE_MEMORY_SOURCE_ID:-integrated-export}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - matverse_core_data:/var/lib/matverse
      - ${MATVERSE_MEMORY_HOST_PATH:-./data/memory}:/var/lib/matverse/memory:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      GPB_API_TOKEN: ${GPB_API_TOKEN:?Set GPB_API_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
      core-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  gpb_data:
  matverse_core_data:
