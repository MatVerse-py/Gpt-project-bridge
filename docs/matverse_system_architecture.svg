<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">MatVerse governed informational architecture</title>
  <desc id="desc">Technical grayscale architecture diagram showing the MatVerse possibility field, governed organism, Bridge planes, closed-under-reference No-Left-Behind coverage, salted corpus commitments, evidence loop and Ω-GATE CanPublish boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black"/></marker>
    <style>.box{fill:white;stroke:black;stroke-width:2}.thin{fill:white;stroke:black;stroke-width:1.5}.dash{fill:white;stroke:black;stroke-width:1.5;stroke-dasharray:8 6}.line{stroke:black;stroke-width:2;fill:none;marker-end:url(#arrow)}.smallline{stroke:black;stroke-width:1.4;fill:none;marker-end:url(#arrow)}.title{font:700 26px sans-serif}.h{font:700 17px sans-serif}.t{font:14px sans-serif}.s{font:12px sans-serif}</style>
  </defs>
  <rect x="20" y="20" width="1360" height="860" rx="28" class="box"/>
  <text x="700" y="58" text-anchor="middle" class="title">MATVERSE — CAMPO GOVERNADO DE POSSIBILIDADES INFORMACIONAIS</text>
  <rect x="70" y="90" width="1260" height="105" rx="18" class="dash"/><text x="700" y="120" text-anchor="middle" class="h">NO-LEFT-BEHIND / COVERAGE PLANE</text><text x="700" y="145" text-anchor="middle" class="t">Discover → Enumerate → Hash → Classify → Relate → Adjudicate → Extend Source Scope → Repeat</text><text x="700" y="168" text-anchor="middle" class="s">Clean sweep: Δobjects=0 · missing=0 · Δsources=0 · R_ext=∅</text><text x="700" y="186" text-anchor="middle" class="s">DISCOVERY_SATURATED only after two complete clean sweeps over the same scope hash</text>
  <rect x="110" y="235" width="300" height="350" rx="18" class="box"/><text x="260" y="267" text-anchor="middle" class="h">BRIDGE · INFORMATION</text><rect x="145" y="295" width="230" height="45" rx="8" class="thin"/><text x="260" y="323" text-anchor="middle" class="t">Project Vault / Corpus</text><rect x="145" y="355" width="230" height="45" rx="8" class="thin"/><text x="260" y="383" text-anchor="middle" class="t">Drive · Mail · GitHub · Notion</text><rect x="145" y="415" width="230" height="58" rx="8" class="thin"/><text x="260" y="438" text-anchor="middle" class="t">Private Fractions</text><text x="260" y="458" text-anchor="middle" class="s">+ salted public commitments</text><rect x="145" y="490" width="230" height="60" rx="8" class="thin"/><text x="260" y="514" text-anchor="middle" class="t">Publication Bridge</text><text x="260" y="534" text-anchor="middle" class="s">Git · HF · arXiv · Zenodo</text>
  <rect x="490" y="220" width="420" height="395" rx="32" class="box"/><text x="700" y="255" text-anchor="middle" class="h">ORGANISMO</text><text x="700" y="280" text-anchor="middle" class="t">informação sob governança + capacidades admitidas + continuidade causal</text><rect x="545" y="310" width="310" height="68" rx="12" class="thin"/><text x="700" y="334" text-anchor="middle" class="t">Governança / Constituição / Ω-Gate</text><text x="700" y="353" text-anchor="middle" class="s">CanExist → CanExecute → CanPersist → CanPublish</text><text x="700" y="370" text-anchor="middle" class="s">Q-Gate ≡ Ω-GATE::CanPublish</text><rect x="545" y="402" width="310" height="55" rx="12" class="thin"/><text x="700" y="427" text-anchor="middle" class="t">Estado governado / identidade / lineage</text><text x="700" y="446" text-anchor="middle" class="s">mnb = primitiva / nó informacional</text><rect x="545" y="482" width="310" height="82" rx="12" class="thin"/><text x="700" y="506" text-anchor="middle" class="t">Fisiologia causal</text><text x="700" y="527" text-anchor="middle" class="s">Perceive → Govern → Act → Observe → Evidence → Inherit</text><text x="700" y="547" text-anchor="middle" class="s">capacidade disponível ≠ capacidade admitida</text>
  <rect x="990" y="235" width="300" height="350" rx="18" class="box"/><text x="1140" y="267" text-anchor="middle" class="h">BRIDGE · CAPABILITY</text><rect x="1025" y="295" width="230" height="45" rx="8" class="thin"/><text x="1140" y="323" text-anchor="middle" class="t">GPT · Claude · Manus · MiniMax</text><rect x="1025" y="355" width="230" height="45" rx="8" class="thin"/><text x="1140" y="383" text-anchor="middle" class="t">Local Models / Runtimes</text><rect x="1025" y="415" width="230" height="45" rx="8" class="thin"/><text x="1140" y="443" text-anchor="middle" class="t">Runtime Discovery / Binding</text><rect x="1025" y="475" width="230" height="65" rx="8" class="thin"/><text x="1140" y="499" text-anchor="middle" class="t">Capability Admission</text><text x="1140" y="519" text-anchor="middle" class="s">contract · test · evidence · authority</text>
  <path d="M 410 410 C 450 410, 455 410, 490 410" class="line"/><path d="M 990 410 C 955 410, 950 410, 910 410" class="line"/>
  <rect x="150" y="660" width="1100" height="145" rx="20" class="box"/><text x="700" y="692" text-anchor="middle" class="h">EVIDENCE / MEMORY / REPLAY PLANE</text><rect x="205" y="720" width="180" height="50" rx="8" class="thin"/><text x="295" y="750" text-anchor="middle" class="t">Receipt</text><rect x="455" y="720" width="180" height="50" rx="8" class="thin"/><text x="545" y="750" text-anchor="middle" class="t">Ledger</text><rect x="705" y="720" width="180" height="50" rx="8" class="thin"/><text x="795" y="750" text-anchor="middle" class="t">Replay / Witness</text><rect x="955" y="720" width="180" height="50" rx="8" class="thin"/><text x="1045" y="750" text-anchor="middle" class="t">Causal Inheritance</text><path d="M 385 745 L 455 745" class="smallline"/><path d="M 635 745 L 705 745" class="smallline"/><path d="M 885 745 L 955 745" class="smallline"/><path d="M 700 615 L 700 660" class="line"/><path d="M 1045 720 C 1045 640, 850 630, 820 564" class="smallline"/>
  <text x="700" y="835" text-anchor="middle" class="s">Publication: Body-A proposal → Body-D adjudication → Body-X execution · Prepared ≠ Approved ≠ Submitted</text><text x="700" y="855" text-anchor="middle" class="s">Structural diagram for documentation/patent support. Diagram ≠ proof of scientific or legal claims.</text>
</svg>