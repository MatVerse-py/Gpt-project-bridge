<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">MatVerse governed informational architecture</title>
  <desc id="desc">Technical grayscale architecture diagram showing the MatVerse possibility field, governed organism, Bridge planes, evidence loop and No-Left-Behind coverage sweep.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
    <style>
      .box { fill: white; stroke: black; stroke-width: 2; }
      .thin { fill: white; stroke: black; stroke-width: 1.5; }
      .dash { fill: white; stroke: black; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .line { stroke: black; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .smallline { stroke: black; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .title { font: 700 26px sans-serif; }
      .h { font: 700 17px sans-serif; }
      .t { font: 14px sans-serif; }
      .s { font: 12px sans-serif; }
    </style>
  </defs>

  <rect x="20" y="20" width="1360" height="860" rx="28" class="box"/>
  <text x="700" y="58" text-anchor="middle" class="title">MATVERSE — CAMPO GOVERNADO DE POSSIBILIDADES INFORMACIONAIS</text>

  <rect x="70" y="90" width="1260" height="95" rx="18" class="dash"/>
  <text x="700" y="120" text-anchor="middle" class="h">NO-LEFT-BEHIND / COVERAGE PLANE</text>
  <text x="700" y="146" text-anchor="middle" class="t">Discover → Enumerate → Hash → Classify → Relate → Adjudicate → Detect Orphans → Repeat</text>
  <text x="700" y="168" text-anchor="middle" class="s">DISCOVERY_SATURATED only after two complete zero-delta sweeps over the same registered scope</text>

  <rect x="110" y="235" width="300" height="330" rx="18" class="box"/>
  <text x="260" y="267" text-anchor="middle" class="h">BRIDGE · INFORMATION</text>
  <rect x="145" y="295" width="230" height="45" rx="8" class="thin"/><text x="260" y="323" text-anchor="middle" class="t">Project Vault / Corpus</text>
  <rect x="145" y="355" width="230" height="45" rx="8" class="thin"/><text x="260" y="383" text-anchor="middle" class="t">Drive · Mail · GitHub · Notion</text>
  <rect x="145" y="415" width="230" height="45" rx="8" class="thin"/><text x="260" y="443" text-anchor="middle" class="t">Corpus Fractions / Manifests</text>
  <rect x="145" y="475" width="230" height="55" rx="8" class="thin"/><text x="260" y="498" text-anchor="middle" class="t">Publication</text><text x="260" y="517" text-anchor="middle" class="s">Git · HF · arXiv · Zenodo</text>

  <rect x="490" y="220" width="420" height="380" rx="32" class="box"/>
  <text x="700" y="255" text-anchor="middle" class="h">ORGANISMO</text>
  <text x="700" y="280" text-anchor="middle" class="t">informação sob governança + capacidades admitidas + continuidade causal</text>

  <rect x="545" y="310" width="310" height="55" rx="12" class="thin"/>
  <text x="700" y="334" text-anchor="middle" class="t">Governança / Constituição / Ω-Gate</text>
  <text x="700" y="353" text-anchor="middle" class="s">ADMIT · HOLD · BLOCK</text>

  <rect x="545" y="390" width="310" height="55" rx="12" class="thin"/>
  <text x="700" y="415" text-anchor="middle" class="t">Estado governado / identidade / lineage</text>
  <text x="700" y="434" text-anchor="middle" class="s">mnb = primitiva / nó informacional</text>

  <rect x="545" y="470" width="310" height="75" rx="12" class="thin"/>
  <text x="700" y="495" text-anchor="middle" class="t">Fisiologia causal</text>
  <text x="700" y="516" text-anchor="middle" class="s">Perceive → Govern → Act → Observe → Evidence → Inherit</text>
  <text x="700" y="536" text-anchor="middle" class="s">capacidade disponível ≠ capacidade admitida</text>

  <rect x="990" y="235" width="300" height="330" rx="18" class="box"/>
  <text x="1140" y="267" text-anchor="middle" class="h">BRIDGE · CAPABILITY</text>
  <rect x="1025" y="295" width="230" height="45" rx="8" class="thin"/><text x="1140" y="323" text-anchor="middle" class="t">GPT · Claude · Manus · MiniMax</text>
  <rect x="1025" y="355" width="230" height="45" rx="8" class="thin"/><text x="1140" y="383" text-anchor="middle" class="t">Local Models / Runtimes</text>
  <rect x="1025" y="415" width="230" height="45" rx="8" class="thin"/><text x="1140" y="443" text-anchor="middle" class="t">Runtime Discovery / Binding</text>
  <rect x="1025" y="475" width="230" height="55" rx="8" class="thin"/><text x="1140" y="498" text-anchor="middle" class="t">Secret Plane / Capability Lease</text><text x="1140" y="517" text-anchor="middle" class="s">scoped · bounded · auditable</text>

  <path d="M 410 400 C 450 400, 455 400, 490 400" class="line"/>
  <path d="M 990 400 C 955 400, 950 400, 910 400" class="line"/>

  <rect x="150" y="650" width="1100" height="150" rx="20" class="box"/>
  <text x="700" y="682" text-anchor="middle" class="h">EVIDENCE / MEMORY / REPLAY PLANE</text>
  <rect x="205" y="710" width="180" height="50" rx="8" class="thin"/><text x="295" y="740" text-anchor="middle" class="t">Receipt</text>
  <rect x="455" y="710" width="180" height="50" rx="8" class="thin"/><text x="545" y="740" text-anchor="middle" class="t">Ledger</text>
  <rect x="705" y="710" width="180" height="50" rx="8" class="thin"/><text x="795" y="740" text-anchor="middle" class="t">Replay / Witness</text>
  <rect x="955" y="710" width="180" height="50" rx="8" class="thin"/><text x="1045" y="740" text-anchor="middle" class="t">Causal Inheritance</text>
  <path d="M 385 735 L 455 735" class="smallline"/>
  <path d="M 635 735 L 705 735" class="smallline"/>
  <path d="M 885 735 L 955 735" class="smallline"/>
  <path d="M 700 600 L 700 650" class="line"/>
  <path d="M 1045 710 C 1045 630, 850 620, 820 545" class="smallline"/>

  <text x="700" y="845" text-anchor="middle" class="s">Structural diagram for documentation/patent support. Diagram ≠ proof of scientific or legal claims.</text>
</svg>
